name: Strattic
description: 'Strattic was a static and headless WordPress hosting platform that pre-rendered WordPress
  sites into static assets for improved security, performance, and scalability, while preserving the
  familiar WordPress admin experience via SFTP and WP-CLI developer access. Strattic was acquired by
  Elementor in 2022 and folded into Elementor Hosting; Elementor announced the sunset of its dedicated
  static hosting service in 2025, and strattic.com now 301-redirects to elementor.com/hosting/. No
  independent Strattic public API, developer portal, or documentation surface remains.'
